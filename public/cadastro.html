
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | LUMIÈRE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <a href="index.html" class="logo">LUMIÈRE</a>
        <span class="top-caption">Faça parte da nossa história</span>
    </header>

    <main class="page-shell">

        <section class="heading">
            <p class="eyebrow">SEJA BEM-VINDO À LUMIÈRE</p>
            <h1>Crie sua <span>conta</span></h1>
            <p>Preencha seus dados para fazer parte da nossa loja.</p>
        </section>

        <section class="panel wide">

            <form id="formCadastro">

                <div class="form-grid">

                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div>
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" required>
                    </div>

                    <div>
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>

                    <div class="full">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="full">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <div class="full section-title">
                        Endereço
                    </div>

                    <div class="full">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" required>
                    </div>

                    <div>
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" required>
                    </div>

                    <div>
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>

                    <div>
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>

                    <div>
                        <label for="administrador">Administrador</label>
                        <input type="text" id="administrador" name="administrador" value="Não" readonly>
                    </div>

                </div>

                <button type="submit">
                    Criar minha conta <span>→</span>
                </button>

                <p class="hint" id="mensagem"></p>

                <p class="foot-text">
                    Já possui uma conta?
                    <a href="index.html">Faça login</a>
                </p>

            </form>

        </section>

    </main>

    <footer>
        LUMIÈRE • Sua moda, suas escolhas • SENAI
    </footer>

    <script src="cadastro.js"></script>

</body>
</html>
